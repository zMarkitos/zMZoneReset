    - " &8| &fInterval: &#8BE3FF{interval}"
    - " &8| &fMin: &#FF7070{minx}, {miny}, {minz}"
    - " &8| &fMax: &#FF7070{maxx}, {maxy}, {maxz}"
    - ""

