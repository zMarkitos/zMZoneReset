# Do not modify
message-version: 1

prefix: "&#D3FF8B&lz&#D5FD92&lM&#D6FB99&lZ&#D8FA9F&lo&#D9F8A6&ln&#DBF6AD&le&#D9F8A6&lR&#D8FA9F&le&#D6FB99&ls&#D5FD92&le&#D3FF8B&lt &8»"

general:
  no-permission: "{prefix} &cYou don't have permission to execute this command."
  player-only: "{prefix} &cThis command can only be used by players."
  unknown-command: "{prefix} &cUnknown subcommand. Use &e/zonereset help &cfor help."
  zone-not-found: "{prefix} &cThe zone &#FFF28B{zone} &cdoes not exist."
  zone-already-exists: "{prefix} &cThe zone &#FFF28B{zone} &calready exists."
  global-spawn-set: "{prefix} &aGlobal spawn set successfully."
  global-spawn-clear: "{prefix} &aGlobal spawn removed."
  reload: "{prefix} &aPlugin reloaded successfully."
  update-join: "{prefix} &ePerforming an update check in the background."
  update-available: "{prefix} &6Update available: &f{current} &8-> &a{latest} &7(ID: {resource})"
  update-latest: "{prefix} &aYou are using the latest version &f{current}&a."

wand:
  name: "&fWand &8→ &#D3FF8B&lSELECTION"
  lore:
    - ""
    - " &8| &fLeft Click: &#FFF28BPosition 1"
    - " &8| &fRight Click: &#FFF28BPosition 2"
    - ""
    - "&#D3FF8B✔ Select the area!"
  given: "{prefix} &aYou have been given the selection wand."
  pos1-set: "{prefix} &fYou have set position 1 at &#FFF28B{x}, {y}, {z}&f."
  pos2-set: "{prefix} &fYou have set position 2 at &#FFF28B{x}, {y}, {z}&f."
  incomplete: "{prefix} &cYou must select two points with the wand."
  different-worlds: "{prefix} &cThe positions must be in the same world."

zones:
  created: "{prefix} &aZone &#FFF28B{zone} &acreated successfully."
  removed: "{prefix} &aZone &#FFF28B{zone} &aremoved."
  enabled: "{prefix} &aZone &#FFF28B{zone} &aenabled."
  disabled: "{prefix} &cZone &#FFF28B{zone} &cdisabled."
  spawn-set: "{prefix} &aSpawn for zone &#FFF28B{zone} &aset."
  spawn-clear: "{prefix} &aSpawn for zone &#FFF28B{zone} &aremoved."
  teleported: "{prefix} &aTeleported to zone &#FFF28B{zone}&a."
  reset-started: "{prefix} &aReset of &#FFF28B{zone} &astarted."
  capture-started: "{prefix} &eCapturing snapshot of &#FFF28B{zone}&e, please wait..."
  capture-done: "{prefix} &aSnapshot of &#FFF28B{zone} &asaved. &7({blocks} blocks)"
  capture-failed: "{prefix} &cError capturing &#FFF28B{zone}&c: {error}"
  saved: "{prefix} &aZone &#FFF28B{zone} &asaved."
  broadcast:
    resetting: "{prefix} &eThe zone &#FFF28B{zone} &eis resetting!"
    reset-complete: "{prefix} &aThe zone &#FFF28B{zone} &ahas been successfully reset!"

