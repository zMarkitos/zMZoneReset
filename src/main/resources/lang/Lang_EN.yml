    - ""
    - "&#D3FF8B✔ Click to toggle."
  settings-messages: "&fSettings &8→ &#D3FF8B&lMessages"
  settings-messages-lore:
    - ""
    - " &8| &fStatus: &f{status}"
    - ""
    - "&#D3FF8B✔ Click to toggle."

