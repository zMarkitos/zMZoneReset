    - " &8| &fCurrent status: &aEnabled"
    - ""
    - "&#D3FF8B✔ Click to disable."

  settings-toggle-lore-disabled:
    - ""
    - " &8| &fCurrent status: &cDisabled"
    - ""
    - "&#D3FF8B✔ Click to enable."

  settings-strategy: "&fSettings &8→ &#D3FF8B&lReset Strategy"
