  list-title: "&8Zone list - Page #{page}"
  main-title: "&8Editing: {zone}"
  settings-title: "&8Settings: {zone}"
  info-title: "&8Information: {zone}"

  next-page: "&fPage &8→ &#D3FF8B&lNext"
  prev-page: "&fPage &8→ &#D3FF8B&lPrevious"
  back: "&fNavigation &8→ &#FF4D2B&lBack"
  close: "&fNavigation &8→ &#FF4D2B&lClose ✖"

  zone-item-name: "&fZone &8→ &#D3FF8B&l{zone}"
  zone-item-lore:
    - ""
    - " &8| &fStatus: &#70FF8B{status}"
    - " &8| &fStrategy: &#FFF28B{strategy}"
    - " &8| &fSnapshot: &#FFBF8B{snapshot}"
    - ""
    - "&#D3FF8B✔ Click to edit!"

  main-settings: "&fEdit &8→ &#D3FF8B&lSettings"
  main-settings-lore:
    - ""
    - " &8| &fAdjust zone parameters."
    - " &8| &fStrategy, interval, etc."
    - ""
    - "&#D3FF8B✔ Click to configure!"

